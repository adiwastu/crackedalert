# Cracked Alert — frontend static site (simple command-builder UI)
# Served from the repo checkout on the VPS. Rendered by deploy_v2.sh
# (replaces %REPO_DIR%).

server {
    listen 80;
    server_name hotland3x3.my.id;

    root %REPO_DIR%/frontend;
    index ui.html;

    location = / {
        return 302 /ui.html;
    }

    location ~* \.(html|css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}