[project]
name = "crackedalert"
version = "2.0.21"
description = "Cracked Alert - Telegram trading bot for cTrader Open API (XAUUSD)"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot>=21,<22",
    "websockets>=12",
    "python-dotenv>=1.0",
]

[project.scripts]
crackedalert = "crackedalert.main:cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]