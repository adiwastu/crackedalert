plugins {
    id 'com.android.application'
}

// Firebase push is optional at build time: the google-services plugin
// only applies once google-services.json (from the Firebase console)
// exists in this folder. Without it the app builds and runs on pure
// polling; FcmService simply never receives anything.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.crackedalert.alarm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.crackedalert.alarm'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.0.3'
}
