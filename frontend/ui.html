<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cracked Alert</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:16px;line-height:1.35;background:#fff;color:#111;max-width:430px;margin:0 auto;padding:14px}
h1{font-size:13px;color:#666;margin-bottom:12px}
h1 b{color:#111}
section{border:1px solid #ddd;border-radius:8px;padding:12px;margin-bottom:14px}
label{display:block;font-weight:700;font-size:13px;margin:8px 0 2px}
input[type=number],input[type=text],select{width:100%;padding:8px;font-size:16px;border:1px solid #888;border-radius:4px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.inline{display:flex;align-items:center;gap:8px;margin-top:8px}
.inline label{margin:0;font-weight:400}
.cmd{font-family:monospace;font-size:14px;background:#f4f4f4;border:1px solid #ddd;border-radius:4px;padding:8px;margin:10px 0;word-break:break-all}
button{display:block;width:100%;padding:11px;font-size:16px;font-weight:700;background:#111;color:#fff;border:none;border-radius:6px;cursor:pointer}
button:focus-visible{outline:3px solid #ffdd00;outline-offset:-2px}
.readout{font-size:13px;color:#00703c;margin-top:6px}
.seg{display:flex;margin-bottom:4px;border:1px solid #111}
.seg button{flex:1;padding:8px;background:#fff;color:#111;border:none;border-right:1px solid #111;font-size:14px}
.seg button:last-child{border-right:none}
.seg button.active{background:#111;color:#fff}
.mini{display:inline-block;width:auto;padding:6px 10px;font-size:13px;font-weight:700;border-radius:4px;flex:none}
.muted{color:#666;font-size:12px}
.hint{font-size:13px;color:#666;margin-top:6px}
.acct{font-weight:700;font-size:13px;margin:12px 0 2px}
.orow{display:flex;gap:6px;align-items:center;margin-top:8px}
.orow .cmd{flex:1;margin:0}
</style>

<h1>Cracked Alert <b>v__VERSION__</b></h1>

<datalist id="note-presets">
  <option value="ChoCh">
  <option value="BoS">
  <option value="LTF ChoCh">
  <option value="LTF BoS">
</datalist>

<script>
const S={orderType:'market',acct:'live100k',rr:2,risk:0.5,widen:'n',priceBroadcast:false,candleBroadcast:false};

function $(id){return document.getElementById(id);}
function copy(cmd,b){navigator.clipboard.writeText(cmd).catch(()=>{const t=document.createElement('textarea');t.value=cmd;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);});if(b)b.textContent='Copied: '+cmd;}

// Mark btnEl active within its seg group, then run fn().
function seg(btnEl,fn){
  var sibs=btnEl.parentNode.children;
  for(var i=0;i<sibs.length;i++)sibs[i].classList.toggle('active',sibs[i]===btnEl);
  if(fn)fn();
}
</script>

<script>
// ---- Trade builder ----
function ordCmd(){
  const sl=$('sl').value, entry=$('inp-entry').value, widen=S.widen;
  if(!sl)return null;
  let base;
  if(S.orderType==='market'){
    base=['/m',sl,widen,S.rr,S.risk,S.acct];
  }else{
    if(!entry)return null;
    base=['/p',entry,sl,widen,S.rr,S.risk,S.acct];
    const cc=$('cancel-price').value;
    if(cc)base.push('--cancel',cc);
  }
  const ss=$('smart-sl').value;
  if(ss)base.push('--smart-sl',ss,$('smart-tf').value);
  return base.join(' ');
}
function ordReadout(){
  const sl=parseFloat($('sl').value), entry=parseFloat($('inp-entry').value);
  const ss=parseFloat($('smart-sl').value);
  const cc=parseFloat($('cancel-price').value);
  const tf=$('smart-tf').value;
  const ro=$('trade-readout');
  let txt='';
  if(!isNaN(sl)&&!isNaN(ss)){
    if(S.orderType==='pending'&&!isNaN(entry)){
      const dist=Math.abs(entry-sl), sd=Math.abs(entry-ss);
      if(dist>0&&sd>=0) txt='Risk at smart SL: '+(S.risk*(sd/dist)).toFixed(2)+'% ('+S.risk+'% at original SL)';
    }else if(S.orderType==='market'){
      txt='Risk at smart SL depends on the live fill (bot reports it)';
    }
    txt+=' \u2014 closes the position when a '+tf+' candle CLOSES past '+ss+' (BUY: below / SELL: above). Broker-side SL stays at your original level.';
  }
  if(S.orderType==='pending'&&!isNaN(cc)&&cc>0){
    txt+=(txt?' \u2014 ':'')+'cancel if price hits '+cc+' before the order fills';
  }
  ro.textContent=txt;
  $('trade-cmd').textContent=ordCmd()??'';
}
</script>

<script>
// ---- Alert builders ----
function priceCmd(){
  const p=$('a-price').value, notes=$('a-notes').value;
  if(!p)return null;
  return '/alert '+p+(notes?' '+notes:'')+(S.priceBroadcast?' --all':'');
}
function candleCmd(){
  const p=$('cc-price').value, tf=$('cc-tf').value, dir=$('cc-dir').value, sym=$('cc-sym').value||'XAUUSD', note=$('cc-note').value;
  if(!p)return null;
  return '/ccalert '+tf+' '+p+' '+dir+' '+sym+(note?' '+note:'')+(S.candleBroadcast?' --all':'');
}
function refresh(){ $('palrt-cmd').textContent=priceCmd()??''; $('calrt-cmd').textContent=candleCmd()??''; }
</script>

<section>
  <div class="seg">
    <button class="active" onclick="seg(this,function(){S.orderType='market';$('entry-fld').style.display='none';ordReadout();});">Market</button>
    <button onclick="seg(this,function(){S.orderType='pending';$('entry-fld').style.display='';ordReadout();});">Pending</button>
  </div>
  <div class="row">
    <div><label>Account</label><select onchange="S.acct=this.value"><option value="live100k">live100k</option><option value="demo">demo</option></select></div>
    <div><label>Risk %</label><select onchange="S.risk=parseFloat(this.value);ordReadout();"><option>0.25</option><option selected>0.5</option><option>0.75</option><option>1</option><option>1.5</option><option>2</option></select></div>
    <div><label>RR</label><select onchange="S.rr=parseFloat(this.value);ordReadout();"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
    <div><label>Widen</label><select id="widen-sl" onchange="S.widen=this.value"><option value="n">No</option><option value="y">Yes</option></select></div>
  </div>
  <div class="row" id="entry-fld" style="display:none">
    <div><label>Entry</label><input id="inp-entry" type="number" step="0.01" placeholder="2400.00" oninput="ordReadout()"></div>
    <div><label>Cancel if hits (optional)</label><input id="cancel-price" type="number" step="0.01" placeholder="e.g. 2490.00" oninput="ordReadout()"></div>
  </div>
  <div class="row">
    <div><label>Original SL</label><input id="sl" type="number" step="0.01" placeholder="2395.00" oninput="ordReadout()"></div>
    <div class="row"><div><label>Smart SL (optional)</label><input id="smart-sl" type="number" step="0.01" placeholder="2398.50" oninput="ordReadout()"></div><div><label>Candle TF</label><select id="smart-tf" onchange="ordReadout()"><option>M1</option><option selected>M5</option><option>M15</option><option>M30</option><option>H1</option></select></div></div>
  </div>
  <div class="cmd" id="trade-cmd"></div>
  <div class="readout" id="trade-readout"></div>
  <button onclick="copy(ordCmd(),$('trade-cmd'))">Copy</button>
</section>

<section>
  <div class="seg" style="margin-bottom:8px">
    <button class="active" onclick="seg(this,function(){$('form-price').style.display='';$('form-candle').style.display='none';});">Price</button>
    <button onclick="seg(this,function(){$('form-price').style.display='none';$('form-candle').style.display='';});">Candle close</button>
  </div>
  <div id="form-price">
    <div class="row"><div><label>Price</label><input id="a-price" type="number" step="0.01" placeholder="2450.00" oninput="refresh()"></div><div><label>Notes</label><input id="a-notes" list="note-presets" placeholder="ChoCh, BoS, LTF ChoCh, LTF BoS or type your own" oninput="refresh()"></div></div>
    <div class="inline"><input id="pa-all" type="checkbox" onchange="S.priceBroadcast=this.checked;refresh()"><label for="pa-all">Alert all subscribers (--all)</label></div>
    <div class="cmd" id="palrt-cmd"></div>
    <button onclick="copy(priceCmd(),$('palrt-cmd'))">Copy</button>
  </div>
  <div id="form-candle" style="display:none">
    <div class="row">
      <div><label>TF</label><select id="cc-tf" onchange="refresh()"><option>M5</option><option>M15</option><option selected>M30</option><option>H1</option><option>H4</option><option>D1</option></select></div>
      <div><label>Dir</label><select id="cc-dir" onchange="refresh()"><option value="above">Above</option><option value="below">Below</option></select></div>
      <div><label>Symbol</label><input id="cc-sym" type="text" value="XAUUSD" oninput="refresh()"></div>
    </div>
    <label>Price</label><input id="cc-price" type="number" step="0.01" placeholder="2450.00" oninput="refresh()">
    <label>Notes</label><input id="cc-note" list="note-presets" placeholder="ChoCh, BoS, LTF ChoCh, LTF BoS or type your own" oninput="refresh()">
    <div class="inline"><input id="ca-all" type="checkbox" onchange="S.candleBroadcast=this.checked;refresh()"><label for="ca-all">Alert all subscribers (--all)</label></div>
    <div class="cmd" id="calrt-cmd"></div>
    <button onclick="copy(candleCmd(),$('calrt-cmd'))">Copy</button>
  </div>
</section>

<section>
  <div class="row" style="align-items:center">
    <div style="flex:3"><b>Working orders</b> <span class="muted" id="orders-n"></span></div>
    <div style="flex:1"><button class="mini" onclick="loadOrders()">Refresh</button></div>
  </div>
  <div class="hint">Unfilled limit/stop orders on the linked accounts — tap <b>copy id</b> for an id to use with <code>/ocancel</code> or <code>/cancel_order</code> in Telegram. Read-only; cancelling/closing stays in Telegram.</div>
  <div class="readout" id="orders-status"></div>
  <div id="orders-list"></div>
</section>

<script>
// ---- Working orders (bot GET /orders, read-only) ----
// deploy_v2.sh stamps ALERT_STATUS_TOKEN over __TOKEN__ in the served
// copy, so the page never asks for it. The prompt path only exists for
// unstamped/local copies of this file.
let TK='__TOKEN__';
function ordersToken(){
  if(TK!=='__TOKEN__')return TK;
  TK=localStorage.getItem('ca_token')||'';
  if(!TK){
    TK=prompt('Alert-status token (ALERT_STATUS_TOKEN in /etc/cracked_alert/.env_cracked):');
    if(TK)localStorage.setItem('ca_token',TK);
  }
  return TK;
}
function hasToken(){return TK!=='__TOKEN__'||!!localStorage.getItem('ca_token');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtP(v){
  if(v==null||v==='')return '\u2013';
  var s=Number(v).toFixed(2).replace(/\.?0+$/,'');
  return s;
}
function loadOrders(){
  var t=ordersToken();
  if(!t)return;
  var st=$('orders-status');
  st.textContent='Loading\u2026';
  fetch('/orders?token='+encodeURIComponent(t)).then(function(r){
    if(r.status===401){localStorage.removeItem('ca_token');TK='__TOKEN__';st.textContent='Bad token \u2014 tap Refresh and enter it again.';return null;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    if(!d)return;
    if(d.error){st.textContent=d.error;return;}
    renderOrders(d.accounts);
    st.textContent='Updated '+new Date().toLocaleTimeString();
  }).catch(function(e){st.textContent='fetch failed: '+e.message;});
}
function renderOrders(accounts){
  var list=$('orders-list'),keys=Object.keys(accounts),html='',total=0;
  if(!keys.length){list.innerHTML='<div class="hint">no accounts configured.</div>';$('orders-n').textContent='';return;}
  keys.forEach(function(acct){
    var a=accounts[acct],rows=a.orders||[];
    total+=rows.length;
    html+='<div class="acct">'+esc(acct)+'</div>';
    if(a.error)html+='<div class="hint">error: '+esc(a.error)+'</div>';
    if(!rows.length){if(!a.error)html+='<div class="hint">no working orders.</div>';return;}
    rows.forEach(function(r){
      html+='<div class="orow"><div class="cmd">'+esc(r.side||'?')+' '+esc(r.symbol||'?')+' <b>'+fmtP(r.volume)+'</b> @ '+fmtP(r.price)+'<br><span class="muted">SL '+fmtP(r.sl)+' \u00b7 TP '+fmtP(r.tp)+' \u00b7 '+(r.extra?esc(r.extra):'')+' \u00b7 #'+esc(r.id)+'</span></div><button class="mini" onclick="copy('+r.id+',this)">copy id</button></div>';
    });
  });
  list.innerHTML=html;
  $('orders-n').textContent='('+total+')';
}
setInterval(function(){ if(hasToken())loadOrders(); },30000);
if(hasToken())loadOrders();
</script>

<script>
ordReadout();
refresh();
</script>
